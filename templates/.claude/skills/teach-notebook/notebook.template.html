<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@@title@@ notebook</title>
<meta name="teach-topic" content="@@topic@@">
<meta name="artifact-url" content="@@artifact_url@@">
<script>
  // The viewer's color style (data-palette, default azul) and page background (data-paper, default tinta)
  // are set before first paint. They live in their own attributes because the Artifact host may set
  // data-theme on the root itself.
  (function () {
    var palette = 'azul';
    var paper = 'tinta';
    try {
      var saved = window.localStorage.getItem('teach-notebook:palette');
      if (/^(azul|verde|purpura|gris|papel|oscuro)$/.test(saved)) palette = saved;
      if (window.localStorage.getItem('teach-notebook:paper') === 'blanco') paper = 'blanco';
    } catch (e) { /* storage blocked */ }
    document.documentElement.setAttribute('data-palette', palette);
    document.documentElement.setAttribute('data-paper', paper);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root {
  --paper: #F6F3EC; --paper-2: #EFE8D8; --rule: #DDD5C4;
  --ink: #1F1D1A; --ink-2: #4A4438; --muted: #8A7F6C;
  --accent: #7A2E2E; --accent-soft: #F1E4DF; --mark: #E6D3A8;
  --ok: #2F5D3A; --ok-soft: #E4ECE2; --danger: #9B2C2C;
  --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1B1A17; --paper-2: #24221E; --rule: #3A362F;
    --ink: #ECE6DA; --ink-2: #C9C1B2; --muted: #948A78;
    --accent: #D08C80; --accent-soft: #3A2624; --mark: #5A4A26;
    --ok: #8FBF98; --ok-soft: #22302A; --danger: #E08A8A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1B1A17; --paper-2: #24221E; --rule: #3A362F;
  --ink: #ECE6DA; --ink-2: #C9C1B2; --muted: #948A78;
  --accent: #D08C80; --accent-soft: #3A2624; --mark: #5A4A26;
  --ok: #8FBF98; --ok-soft: #22302A; --danger: #E08A8A;
  color-scheme: dark;
}
/* Color styles: each one draws every tone from a single hue family, on a tinted (never pure white) page.
   Azul = seguridad, verde = tranquilidad, purpura = paciencia, gris = orden. They come after the
   theme blocks so the viewer's chosen style wins over the system theme. */
:root[data-palette="azul"] {
  --paper: #F2F5F8; --paper-2: #E3EAF1; --rule: #D3DCE6;
  --ink: #172230; --ink-2: #3C4A5C; --muted: #6B7A8C;
  --accent: #2F4E6F; --accent-soft: #DCE5EF; --mark: #CFDCEA;
  --ok: #2F4E6F; --ok-soft: #E3EAF1; --danger: #8E3B3B;
  color-scheme: light;
}
:root[data-palette="verde"] {
  --paper: #F3F6F2; --paper-2: #E2EBE2; --rule: #D2DDD3;
  --ink: #1A261D; --ink-2: #3E4F42; --muted: #6C7D70;
  --accent: #3F6B4F; --accent-soft: #DCE8DE; --mark: #CFE0D2;
  --ok: #3F6B4F; --ok-soft: #E2EBE2; --danger: #8E3B3B;
  color-scheme: light;
}
:root[data-palette="purpura"] {
  --paper: #F6F4F8; --paper-2: #EAE5F0; --rule: #DCD5E5;
  --ink: #221D2B; --ink-2: #463E52; --muted: #7C7389;
  --accent: #5B4B7A; --accent-soft: #E4DDEE; --mark: #DDD3EA;
  --ok: #5B4B7A; --ok-soft: #EAE5F0; --danger: #8E3B3B;
  color-scheme: light;
}
:root[data-palette="gris"] {
  --paper: #F4F4F3; --paper-2: #E8E8E6; --rule: #D6D6D3;
  --ink: #1E1F21; --ink-2: #44464A; --muted: #75777B;
  --accent: #4A4F57; --accent-soft: #E1E1DF; --mark: #DCDDDF;
  --ok: #4A4F57; --ok-soft: #E8E8E6; --danger: #8E3B3B;
  color-scheme: light;
}
:root[data-palette="papel"] {
  --paper: #F6F3EC; --paper-2: #EFE8D8; --rule: #DDD5C4;
  --ink: #1F1D1A; --ink-2: #4A4438; --muted: #8A7F6C;
  --accent: #7A2E2E; --accent-soft: #F1E4DF; --mark: #E6D3A8;
  --ok: #2F5D3A; --ok-soft: #E4ECE2; --danger: #9B2C2C;
  color-scheme: light;
}
:root[data-palette="oscuro"] {
  --paper: #1B1A17; --paper-2: #24221E; --rule: #3A362F;
  --ink: #ECE6DA; --ink-2: #C9C1B2; --muted: #948A78;
  --accent: #D08C80; --accent-soft: #3A2624; --mark: #5A4A26;
  --ok: #8FBF98; --ok-soft: #22302A; --danger: #E08A8A;
  color-scheme: dark;
}
/* "Blanco" background: only the page goes near-white; callouts, highlights, rules and buttons keep the
   style's color. Oscuro has no white variant. */
:root[data-paper="blanco"]:not([data-palette="oscuro"]) { --paper: #FDFDFC; }
:root[data-palette="oscuro"] .paper-control { display: none; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); accent-color: var(--accent); font-family: var(--serif); font-size: 18px; line-height: 1.65; }
.app { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: 0; height: 100vh; overflow-y: auto; border-right: 1px solid var(--rule); padding: 32px 18px; font-size: 15px; }
.rail-title { font-family: var(--sans); font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 18px 12px; }
.rail a { display: block; color: var(--muted); text-decoration: none; padding: 6px 10px; border-left: 2px solid transparent; line-height: 1.35; }
.rail a:hover { color: var(--ink); }
.rail a[aria-current="page"] { color: var(--accent); border-left-color: var(--accent); }
.rail .num { font-family: var(--mono); font-size: 12px; margin-right: 8px; }
.rail .sep { border-top: 1px solid var(--rule); margin: 14px 0 14px 12px; }
.picker { display: none; }
main { padding: 48px 56px 96px; max-width: 820px; margin: 0 auto; }
article p, article li, .answer p { text-align: justify; -webkit-hyphens: auto; hyphens: auto; }
.rail-foot { margin: 24px 0 0 12px; }
.rail-foot label { display: block; font-family: var(--sans); font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.rail-foot .paper-control { margin-top: 12px; }
.palette-picker { font-family: var(--sans); font-size: 13px; padding: 5px 8px; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; }
.eyebrow { font-family: var(--sans); font-size: 13px; color: var(--muted); }
article h1 { font-size: 34px; line-height: 1.2; font-weight: 500; margin: 6px 0 24px; }
article h2 { font-size: 24px; font-weight: 500; line-height: 1.3; margin: 40px 0 12px; padding-top: 16px; border-top: 1px solid var(--rule); }
article h3 { font-size: 19px; font-weight: 500; margin: 28px 0 8px; }
a { color: var(--accent); }
mark { background: var(--mark); color: inherit; padding: 0 .15em; border-radius: 2px; }
code { font-family: var(--mono); font-size: .85em; background: var(--paper-2); padding: .1em .35em; border-radius: 3px; }
pre { background: var(--paper-2); padding: 14px 16px; border-radius: 6px; overflow-x: auto; line-height: 1.5; }
pre code { background: none; padding: 0; }
blockquote { margin: 16px 0; padding: 2px 16px; border-left: 2px solid var(--rule); color: var(--ink-2); }
.table-wrap { overflow-x: auto; margin: 16px 0; }
table { border-collapse: collapse; width: 100%; font-family: var(--sans); font-size: 14px; line-height: 1.45; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 500; color: var(--ink-2); border-bottom-color: var(--ink-2); }
.wikilink { border-bottom: 1px dotted var(--accent); cursor: help; }
.callout { margin: 20px 0; padding: 12px 16px; background: var(--paper-2); border-left: 2px solid var(--accent); }
.callout-title { font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--accent); margin-bottom: 4px; }
.callout > :last-child { margin-bottom: 0; }
details.callout > summary { cursor: pointer; list-style: none; margin-bottom: 0; }
details.callout > summary::-webkit-details-marker { display: none; }
details.callout > summary::before { content: "+ "; font-family: var(--mono); }
details.callout[open] > summary { margin-bottom: 4px; }
details.callout[open] > summary::before { content: "\2212  "; }
.explore { margin: 40px 0; border: 1px solid var(--rule); border-radius: 10px; padding: 18px 20px; }
.explore-label { font-family: var(--sans); font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
button { font-family: var(--sans); font-size: 13px; color: var(--accent); background: transparent; border: 1px solid var(--accent); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
button:hover { background: var(--accent-soft); }
button:focus-visible, textarea:focus-visible, select:focus-visible, .rail a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.quiz-tools { display: flex; justify-content: flex-end; margin: 0 0 8px; }
.q-box { margin: 10px 0 18px; }
.q-box textarea { display: block; width: 100%; min-height: 64px; font-family: var(--serif); font-size: 16px; color: var(--ink); background: transparent; border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; resize: vertical; }
.q-actions { margin-top: 8px; }
.answer { margin-top: 10px; padding: 10px 14px; background: var(--ok-soft); border-left: 2px solid var(--ok); }
.answer > :first-child { margin-top: 0; }
.answer > :last-child { margin-bottom: 0; }
.build-error { font-family: var(--sans); color: var(--danger); }
.math { font-family: var(--mono); font-size: .85em; color: var(--ink-2); }
.math-display { display: block; margin: 16px 0; overflow-x: auto; text-align: center; }
.math.math-ready { font-family: inherit; font-size: inherit; color: inherit; }
@media (max-width: 720px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .picker { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; position: sticky; top: 0; z-index: 1; background: var(--paper); border-bottom: 1px solid var(--rule); padding: 10px 16px; }
  .picker #picker { flex: 1 1 100%; min-width: 0; font-family: var(--sans); font-size: 15px; padding: 8px; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; }
  main { padding: 24px 16px 72px; }
  article p, article li, .answer p { text-align: left; }
  article h1 { font-size: 28px; }
}
</style>

  <nav class="rail" aria-label="Sesiones">
    <p class="rail-title" id="rail-title"></p>
    <div id="rail-links"></div>

        <option value="azul">Azul</option><option value="verde">Verde</option><option value="purpura">Púrpura</option>
        <option value="gris">Gris</option><option value="papel">Papel</option><option value="oscuro">Oscuro</option>

        <option value="gris">Gris</option><option value="papel">Papel</option><option value="oscuro">Oscuro</option>
      </select>
      <select id="paper-top" class="palette-picker paper-control" data-paper-picker aria-label="Fondo">
        <option value="tinta">Con tinte</option><option value="blanco">Blanco</option>
      </select>
    </div>
    <main id="main" lang="es"></main>
  </div>
</div>

<script>
(function () {
  'use strict';

  var TOPIC = document.querySelector('meta[name="teach-topic"]').getAttribute('content');
  var store = {
    get: function (key) {
      try { return window.localStorage.getItem('teach-notebook:' + TOPIC + ':' + key); } catch (e) { return null; }
    },
    set: function (key, value) {
      try { window.localStorage.setItem('teach-notebook:' + TOPIC + ':' + key, value); } catch (e) { /* storage blocked: keep working */ }
    }
  };

  // ---- Color style --------------------------------------------------------

  // The head script already applied the remembered style; this keeps both pickers in sync with it.
  var pickers = document.querySelectorAll('[data-palette-picker]');
  function applyPalette(palette) {
    document.documentElement.setAttribute('data-palette', palette);
    pickers.forEach(function (sel) { sel.value = palette; });
  }
  applyPalette(document.documentElement.getAttribute('data-palette') || 'azul');
  pickers.forEach(function (sel) {
    sel.addEventListener('change', function () {
      applyPalette(sel.value);
      try { window.localStorage.setItem('teach-notebook:palette', sel.value); } catch (e) { /* not remembered */ }
    });
  });

  var paperPickers = document.querySelectorAll('[data-paper-picker]');
  function applyPaper(paper) {
    document.documentElement.setAttribute('data-paper', paper);
    paperPickers.forEach(function (sel) { sel.value = paper; });
  }
  applyPaper(document.documentElement.getAttribute('data-paper') === 'blanco' ? 'blanco' : 'tinta');
  paperPickers.forEach(function (sel) {
    sel.addEventListener('change', function () {
      applyPaper(sel.value);
      try { window.localStorage.setItem('teach-notebook:paper', sel.value); } catch (e) { /* not remembered */ }
    });
  });

  // ---- Markdown ---------------------------------------------------------

  // Reverse the assembler's escapes. Literals are split so this script never contains them.
  function readBlock(el) {
    return el.textContent
      .replace(/^\n/, '')
      .replace(/<\\\/script/g, '<' + '/script')
      .replace(/<\\!--/g, '<' + '!--');
  }

  function splitFrontmatter(md) {
    var m = /^---\n([\s\S]*?)\n---(?:\n|$)/.exec(md);
    if (!m) return { meta: {}, body: md };
    var meta = {};
    m[1].split('\n').forEach(function (line) {
      var kv = /^([A-Za-z_][\w-]*):\s*(.*)$/.exec(line);
      if (kv) meta[kv[1]] = kv[2].replace(/^["']|["']$/g, '').trim();
    });
    return { meta: meta, body: md.slice(m[0].length) };
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  marked.use({
    gfm: true,
    extensions: [
      {
        name: 'wikilink',
        level: 'inline',
        start: function (src) { var i = src.indexOf('[['); return i < 0 ? undefined : i; },
        tokenizer: function (src) {
          var m = /^\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/.exec(src);
          if (m) return { type: 'wikilink', raw: m[0], target: m[1].trim(), label: (m[2] || m[1]).trim() };
        },
        renderer: function (token) {
          return '<span class="wikilink" title="' + escapeHtml(token.target) + '">' + escapeHtml(token.label) + '</span>';
        }
      },
      {
        name: 'highlight',
        level: 'inline',
        start: function (src) { var i = src.indexOf('=='); return i < 0 ? undefined : i; },
        tokenizer: function (src) {
          var m = /^==(?=\S)([\s\S]*?\S)==/.exec(src);
          if (m) return { type: 'highlight', raw: m[0], tokens: this.lexer.inlineTokens(m[1]) };
        },
        renderer: function (token) { return '<mark>' + this.parser.parseInline(token.tokens) + '</mark>'; }
      }
    ]
  });

  // ---- Math ---------------------------------------------------------------

  // TeX ($$...$$ and $...$, Obsidian's rules) is pulled out before marked sees it, so underscores and
  // backslashes survive. MathJax is fetched only when a tab has math; offline, the raw TeX stays.
  var MATHJAX = 'https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js';
  var mathSources = [];
  var mathJaxReady = null;

  function mathSlot(tex, display) {
    mathSources.push(tex);
    return '<span class="math' + (display ? ' math-display' : '') + '" data-math="' + (mathSources.length - 1) + '"></span>';
  }

  // Scan prose (never code): skip backtick spans, keep \$ literal, and leave "$5 or $10" alone.
  function protectChunk(s) {
    var out = '';
    var i = 0;
    while (i < s.length) {
      var c = s.charAt(i);
      if (c === '`') {
        var run = /^`+/.exec(s.slice(i))[0];
        var close = s.indexOf(run, i + run.length);
        if (close < 0) { out += run; i += run.length; continue; }
        out += s.slice(i, close + run.length);
        i = close + run.length;
        continue;
      }
      if (c === '\\' && s.charAt(i + 1) === '$') { out += '\\$'; i += 2; continue; }
      if (c === '$' && s.charAt(i + 1) === '$') {
        var end = s.indexOf('$$', i + 2);
        if (end > i + 2) { out += mathSlot(s.slice(i + 2, end).trim(), true); i = end + 2; continue; }
      } else if (c === '$') {
        var m = /^\$(?=\S)([^$\n]*?\S)\$(?!\d)/.exec(s.slice(i));
        if (m) { out += mathSlot(m[1], false); i += m[0].length; continue; }
      }
      out += c;
      i++;
    }
    return out;
  }

  function protectMath(md) {
    var out = [];
    var chunk = [];
    var fence = null;
    function flush() { if (chunk.length) { out.push(protectChunk(chunk.join('\n'))); chunk = []; } }
    md.split('\n').forEach(function (line) {
      var f = /^\s*(`{3,}|~{3,})/.exec(line);
      if (fence) {
        out.push(line);
        if (f && f[1].charAt(0) === fence) fence = null;
        return;
      }
      if (f) { flush(); fence = f[1].charAt(0); out.push(line); return; }
      chunk.push(line);
    });
    flush();
    return out.join('\n');
  }

  function loadMathJax() {
    if (!mathJaxReady) {
      window.MathJax = { startup: { typeset: false }, svg: { fontCache: 'local' } };
      mathJaxReady = loadScript(MATHJAX).then(function () { return window.MathJax.startup.promise; }).then(function () {
        // MathJax's own CSS hides the assistive MathML copy that tex2svg adds next to each SVG.
        document.head.appendChild(window.MathJax.svgStylesheet());
      });
    }
    return mathJaxReady;
  }

  function typesetMath(root) {
    var slots = root.querySelectorAll('.math[data-math]');
    if (!slots.length) return;
    slots.forEach(function (el) { el.textContent = mathSources[+el.getAttribute('data-math')]; });
    loadMathJax().then(function () {
      slots.forEach(function (el) {
        try {
          var svg = window.MathJax.tex2svg(mathSources[+el.getAttribute('data-math')], { display: el.classList.contains('math-display') });
          el.textContent = '';
          el.appendChild(svg);
          el.classList.add('math-ready');
        } catch (e) { /* bad TeX: keep the source visible */ }
      });
    }).catch(function () { /* offline: the raw TeX stays readable */ });
  }

  var CALLOUT = /^>\s*\[!([A-Za-z-]+)\]([+-]?)\s*(.*)$/;

  function calloutHtml(type, fold, title, body) {
    if (type === 'success' && /^respuesta\b/i.test(title)) {
      return '<div class="answer" hidden>' + body + '</div>';
    }
    // One "Respuestas" block holding a numbered list: enhanceQuiz hands item N to question N.
    if (type === 'success' && /^respuestas\b/i.test(title)) {
      return '<div class="answer answer-list" hidden>' + body + '</div>';
    }
    var label = title ? marked.parseInline(title) : escapeHtml(type.charAt(0).toUpperCase() + type.slice(1));
    var typeAttr = ' data-type="' + escapeHtml(type) + '"';
    if (fold) {
      return '<details class="callout"' + typeAttr + (fold === '+' ? ' open' : '') + '>' +
        '<summary class="callout-title">' + label + '</summary>' + body + '</details>';
    }
    return '<div class="callout"' + typeAttr + '><div class="callout-title">' + label + '</div>' + body + '</div>';
  }

  // Obsidian callouts become pre-rendered HTML slots, so blank lines inside them can't break marked's HTML blocks.
  function renderMarkdown(md) {
    var lines = protectMath(md).split('\n');
    var out = [];
    var slots = [];
    var fence = null;
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var f = /^\s*(`{3,}|~{3,})/.exec(line);
      if (f) {
        if (!fence) fence = f[1].charAt(0);
        else if (f[1].charAt(0) === fence) fence = null;
      }
      var m = fence ? null : CALLOUT.exec(line);
      if (!m) { out.push(line); continue; }
      var inner = [];
      while (i + 1 < lines.length && /^>/.test(lines[i + 1])) {
        i++;
        inner.push(lines[i].replace(/^>\s?/, ''));
      }
      out.push('', '<div data-slot="' + slots.length + '"></div>', '');
      slots.push(calloutHtml(m[1].toLowerCase(), m[2], m[3], renderMarkdown(inner.join('\n'))));
    }
    return marked.parse(out.join('\n')).replace(/<div data-slot="(\d+)"><\/div>/g, function (_, n) { return slots[+n]; });
  }

  function wrapTables(root) {
    root.querySelectorAll('table').forEach(function (table) {
      var wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      table.parentNode.insertBefore(wrap, table);
      wrap.appendChild(table);
    });
  }

  // ---- Quiz ---------------------------------------------------------------

  function parseAnswers(md) {
    var map = {};
    if (!md) return map;
    var current = null;
    var buffer = [];
    function flush() { if (current !== null) map[current] = renderMarkdown(buffer.join('\n')); }
    splitFrontmatter(md).body.split('\n').forEach(function (line) {
      var m = /^(\d+)\.\s+(.*)$/.exec(line);
      if (m) { flush(); current = +m[1]; buffer = [m[2]]; return; }
      if (/^#/.test(line)) { flush(); current = null; buffer = []; return; }
      if (current !== null) buffer.push(line.replace(/^ {1,4}/, ''));
    });
    flush();
    return map;
  }

  function setRevealed(answer, btn, on) {
    answer.hidden = !on;
    btn.textContent = on ? 'Ocultar' : 'Revelar';
    btn.setAttribute('aria-expanded', on ? 'true' : 'false');
  }

  function revealButton(answer, label) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = 'Revelar';
    btn.setAttribute('aria-expanded', 'false');
    btn.setAttribute('aria-label', label);
    btn.addEventListener('click', function () { setRevealed(answer, btn, answer.hidden); });
    answer.setAttribute('data-wired', '');
    return btn;
  }

  function enhanceQuiz(article, num, answersMd) {
    var quiz = null;
    article.querySelectorAll('h2').forEach(function (h) {
      if (!quiz && /^quiz/i.test(h.textContent.trim())) quiz = h;
    });
    if (!quiz) return null;
    var external = parseAnswers(answersMd);
    var items = [];
    var lists = [];
    for (var el = quiz.nextElementSibling; el && el.tagName !== 'H2'; el = el.nextElementSibling) {
      if (el.tagName === 'OL') {
        var start = parseInt(el.getAttribute('start') || '1', 10);
        for (var k = 0; k < el.children.length; k++) items.push({ li: el.children[k], n: start + k, answer: null });
      } else if (el.classList.contains('answer-list')) {
        lists.push(el);
      } else if (el.classList.contains('answer') && items.length) {
        items[items.length - 1].answer = el;
      }
    }
    lists.forEach(function (list) {
      var ol = list.querySelector('ol');
      if (!ol) return;
      var first = parseInt(ol.getAttribute('start') || '1', 10);
      for (var j = 0; j < ol.children.length; j++) {
        if (!external[first + j]) external[first + j] = ol.children[j].innerHTML;
      }
      list.parentNode.removeChild(list);
    });
    var pairs = [];
    items.forEach(function (item) {
      var answer = item.answer;
      if (!answer && external[item.n]) {
        answer = document.createElement('div');
        answer.className = 'answer';
        answer.hidden = true;
        answer.innerHTML = external[item.n];
      }
      var box = document.createElement('div');
      box.className = 'q-box';
      var area = document.createElement('textarea');
      var key = 'answer:' + num + ':' + item.n;
      area.placeholder = 'Tu respuesta, de memoria';
      area.setAttribute('aria-label', 'Tu respuesta a la pregunta ' + item.n);
      area.value = store.get(key) || '';
      area.addEventListener('input', function () { store.set(key, area.value); });
      box.appendChild(area);
      if (answer) {
        var btn = revealButton(answer, 'Revelar respuesta ' + item.n);
        var actions = document.createElement('div');
        actions.className = 'q-actions';
        actions.appendChild(btn);
        box.appendChild(actions);
        box.appendChild(answer);
        pairs.push({ answer: answer, btn: btn });
      }
      item.li.appendChild(box);
    });
    if (pairs.length) {
      var tools = document.createElement('div');
      tools.className = 'quiz-tools';
      var all = document.createElement('button');
      all.type = 'button';
      all.textContent = 'Revelar todas';
      all.addEventListener('click', function () {
        var anyHidden = pairs.some(function (p) { return p.answer.hidden; });
        pairs.forEach(function (p) { setRevealed(p.answer, p.btn, anyHidden); });
        all.textContent = anyHidden ? 'Ocultar todas' : 'Revelar todas';
      });
      tools.appendChild(all);
      quiz.parentNode.insertBefore(tools, quiz.nextSibling);
    }
    return quiz;
  }

  // An answer callout outside the quiz still gets its own button instead of staying hidden forever.
  function wireLooseAnswers(article) {
    article.querySelectorAll('.answer:not([data-wired])').forEach(function (answer) {
      answer.parentNode.insertBefore(revealButton(answer, 'Revelar respuesta'), answer);
    });
  }

  // ---- Widgets ------------------------------------------------------------

  var widgetRoots = {};
  var widgetStarted = {};
  var scriptCache = {};
  window.__teachNotebook = {
    root: function (num) { return widgetRoots[num]; },
    started: function (num) { widgetStarted[num] = true; },
    fail: function (num, err) { showWidgetError(num, err); }
  };

  function showWidgetError(num, err) {
    var root = widgetRoots[num];
    if (!root) return;
    root.innerHTML = '<p style="font-family:var(--sans);font-size:14px;color:var(--danger);margin:0">El widget falló: ' +
      escapeHtml(err && err.message ? err.message : String(err)) + '</p>';
  }

  function loadScript(src) {
    if (!scriptCache[src]) {
      scriptCache[src] = new Promise(function (resolve, reject) {
        var el = document.createElement('script');
        el.src = src;
        el.onload = resolve;
        el.onerror = function () { reject(new Error('no se pudo cargar ' + src)); };
        document.head.appendChild(el);
      });
    }
    return scriptCache[src];
  }

  // Injected <script> instead of eval/new Function, which a page CSP may block. A script that never
  // calls started() failed to parse.
  function runInline(num, code) {
    var tag = JSON.stringify(num);
    var el = document.createElement('script');
    el.textContent = 'window.__teachNotebook.started(' + tag + ');(function (root) {\ntry {\n' + code +
      '\n} catch (e) { window.__teachNotebook.fail(' + tag + ', e); }\n})(window.__teachNotebook.root(' + tag + '));';
    widgetStarted[num] = false;
    document.body.appendChild(el);
    if (!widgetStarted[num]) throw new Error('error de sintaxis en el script del widget');
  }

  function mountWidget(article, num, before) {
    var tpl = document.querySelector('template[data-widget="' + num + '"]');
    if (!tpl) return;
    var card = document.createElement('section');
    card.className = 'explore';
    card.innerHTML = '<div class="explore-label">Explora</div>';
    var host = document.createElement('div');
    card.appendChild(host);
    if (before) article.insertBefore(card, before); else article.appendChild(card);
    var root = host.attachShadow({ mode: 'open' });
    widgetRoots[num] = root;
    var frag = tpl.content.cloneNode(true);
    var scripts = Array.prototype.slice.call(frag.querySelectorAll('script'));
    scripts.forEach(function (s) { s.parentNode.removeChild(s); });
    var base = document.createElement('style');
    base.textContent = ':host{display:block;font-family:var(--sans);color:var(--ink);font-size:15px;line-height:1.5}';
    root.appendChild(base);
    root.appendChild(frag);
    scripts.reduce(function (chain, s) {
      return chain.then(function () {
        var src = s.getAttribute('src');
        if (src) return loadScript(src);
        runInline(num, s.textContent);
      });
    }, Promise.resolve()).catch(function (err) { showWidgetError(num, err); });
  }

  // ---- Views --------------------------------------------------------------

  function formatDate(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
    if (!m) return iso;
    try {
      return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]))
        .toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
    } catch (e) { return iso; }
  }

  function sessionTitle(body, num) {
    var h = /^#\s+(.+)$/m.exec(body);
    if (!h) return 'Sesión ' + num;
    return h[1]
      .replace(/^\d+\s*[—–:-]\s*/, '')
      .replace(/\[\[([^\]|]+)\|?([^\]]*)\]\]/g, function (_, a, b) { return b || a; })
      .replace(/==|\*\*|__|`/g, '')
      .trim();
  }

  var sessions = [];
  document.querySelectorAll('script[type="text/markdown"][data-session]').forEach(function (el) {
    var num = el.getAttribute('data-session');
    var doc = splitFrontmatter(readBlock(el));
    var answersEl = document.querySelector('script[data-answers="' + num + '"]');
    var n = String(parseInt(num, 10));
    sessions.push({
      id: 's-' + num,
      num: num,
      label: n.length < 2 ? '0' + n : n,
      meta: doc.meta,
      body: doc.body,
      answers: answersEl ? readBlock(answersEl) : '',
      title: sessionTitle(doc.body, num)
    });
  });

  var progressEl = document.getElementById('progress');
  var progressMd = progressEl ? readBlock(progressEl) : '';
  var topicTitle = ((/^#\s+(.+)$/m.exec(progressMd) || [])[1] || TOPIC)
    .replace(/^Teach(?: |-|:|—|–)+/, '')
    .replace(/(?: |-|:|—|–)+Progress$/, '');

  function buildSession(s) {
    var article = document.createElement('article');
    var eyebrow = 'Sesión ' + s.num + (s.meta.date ? ' · ' + formatDate(s.meta.date) : '');
    article.innerHTML = '<div class="eyebrow">' + escapeHtml(eyebrow) + '</div>' + renderMarkdown(s.body);
    wrapTables(article);
    var quiz = enhanceQuiz(article, s.num, s.answers);
    wireLooseAnswers(article);
    typesetMath(article);
    return { el: article, mount: function () { mountWidget(article, s.num, quiz); } };
  }

  function buildProgress() {
    var article = document.createElement('article');
    article.innerHTML = '<div class="eyebrow">Progreso</div>' + renderMarkdown(progressMd);
    wrapTables(article);
    typesetMath(article);
    return { el: article };
  }

  function safeBuild(view) {
    try { return view.build(); } catch (err) {
      var article = document.createElement('article');
      article.innerHTML = '<p class="build-error">No se pudo mostrar esta pestaña: ' + escapeHtml(err.message || String(err)) + '</p>';
      return { el: article };
    }
  }

  var main = document.getElementById('main');
  var links = document.getElementById('rail-links');
  var picker = document.getElementById('picker');
  document.getElementById('rail-title').textContent = topicTitle;

  var views = sessions.map(function (s) {
    return { id: s.id, num: s.label, text: s.title, build: function () { return buildSession(s); } };
  });
  views.push({ id: 'progreso', num: '', text: 'Progreso', build: buildProgress });

  views.forEach(function (v, idx) {
    if (v.id === 'progreso' && idx > 0) {
      var sep = document.createElement('div');
      sep.className = 'sep';
      links.appendChild(sep);
    }
    var a = document.createElement('a');
    a.href = '#' + v.id;
    a.setAttribute('data-view', v.id);
    a.innerHTML = (v.num ? '<span class="num">' + v.num + '</span>' : '') + escapeHtml(v.text);
    links.appendChild(a);
    var opt = document.createElement('option');
    opt.value = v.id;
    opt.textContent = (v.num ? v.num + ' · ' : '') + v.text;
    picker.appendChild(opt);
  });
  picker.addEventListener('change', function () { location.hash = picker.value; });

  var built = {};
  function show(id) {
    var view = null;
    views.forEach(function (v) { if (v.id === id) view = v; });
    if (!view) view = views[Math.max(0, sessions.length - 1)];
    if (!built[view.id]) {
      built[view.id] = safeBuild(view);
      main.appendChild(built[view.id].el);
    }
    Object.keys(built).forEach(function (k) { built[k].el.hidden = k !== view.id; });
    var entry = built[view.id];
    if (entry.mount && !entry.mounted) {
      entry.mounted = true;
      try { entry.mount(); } catch (err) { /* a broken widget must not take the tab down */ }
    }
    links.querySelectorAll('a').forEach(function (a) {
      if (a.getAttribute('data-view') === view.id) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
    picker.value = view.id;
    store.set('last', view.id);
  }

  window.addEventListener('hashchange', function () { show(location.hash.slice(1)); window.scrollTo(0, 0); });
  show(location.hash.slice(1) || store.get('last') || '');
})();
</script>
</body>
</html>
